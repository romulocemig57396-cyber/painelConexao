name: CI

on:
  push:
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Sem SQL Server disponível no runner: só valida que os módulos carregam
      # (erros de sintaxe/require) e que o processo sobe e responde no /api/health.
      - run: |
          cp .env.example .env
          node src/index.js &
          server_pid=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:3001/api/health > /dev/null; then
              echo "servidor respondeu OK"
              kill $server_pid
              exit 0
            fi
            sleep 0.5
          done
          echo "servidor não respondeu em /api/health"
          kill $server_pid
          exit 1
